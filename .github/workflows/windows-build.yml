name: Windows build and verification
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-customer-installer]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the installer compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler is unavailable.' }
      - name: Test, build, and verify the application
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            source-installation-check.json
            dist/STEP2NC1/installation-check.json
            dist/STEP2NC1/build-dependencies.txt
            build/windows/warn-windows.txt
            installer-evidence/
      - name: Retain the build for review
        uses: actions/upload-artifact@v4
        with:
          name: STEP2NC1-Windows-Installer
          path: dist/installer/
          if-no-files-found: error
